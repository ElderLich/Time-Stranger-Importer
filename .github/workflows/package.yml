name: Package Blender Addon

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: Validate and package addon
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Python syntax
        run: python -m compileall -q __init__.py data external src

      - name: Build installable zip
        run: python tools/package_addon.py --output dist/Time_Stranger_Importer.zip

      - name: Check package contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          zip_path = Path("dist/Time_Stranger_Importer.zip")
          required = {
              "Time_Stranger_Importer/__init__.py",
              "Time_Stranger_Importer/src/dsts_formats.cp313-win_amd64.pyd",
          }
          with zipfile.ZipFile(zip_path) as zf:
              names = set(zf.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"package missing required files: {missing}")
          print(f"OK: {zip_path} contains {len(names)} files")
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Time_Stranger_Importer
          path: dist/Time_Stranger_Importer.zip
          if-no-files-found: error

      - name: Attach package to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Time_Stranger_Importer.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "Automated Time Stranger Importer build." \
          || gh release upload "$GITHUB_REF_NAME" dist/Time_Stranger_Importer.zip --clobber
