name: Package Blender Addon

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      automatic_release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set the Blender release version
        id: version
        if: inputs.automatic_release || startsWith(github.ref, 'refs/tags/v')
        env:
          AUTOMATIC_RELEASE: ${{ inputs.automatic_release }}
        run: |
          if [[ "$AUTOMATIC_RELEASE" == "true" ]]; then
            tag=$(python tools/prepare_release.py --run-number "$GITHUB_RUN_NUMBER")
          else
            tag=$(python tools/prepare_release.py --tag "$GITHUB_REF_NAME")
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Validate syntax and build the installable ZIP
        run: |
          python -m compileall -q __init__.py data external src
          python tools/package_addon.py

      - name: Check package contents
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python - <<'PY'
          import ast
          import os
          import zipfile

          with zipfile.ZipFile("dist/Time_Stranger_Importer.zip") as archive:
              assert archive.testzip() is None
              archive.getinfo("Time_Stranger_Importer/src/dsts_formats.cp313-win_amd64.pyd")
              source = archive.read("Time_Stranger_Importer/__init__.py")
          tree = ast.parse(source)
          info = next(n.value for n in tree.body if isinstance(n, ast.Assign) and
                      any(isinstance(t, ast.Name) and t.id == "bl_info" for t in n.targets))
          tag = "v" + ".".join(map(str, ast.literal_eval(info)["version"]))
          assert not os.environ["RELEASE_TAG"] or tag == os.environ["RELEASE_TAG"]
          print(f"Verified installable Blender add-on {tag}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Time_Stranger_Importer
          path: dist/Time_Stranger_Importer.zip
          if-no-files-found: error
          overwrite: true

  publish:
    needs: package
    if: (inputs.automatic_release || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: importer-release-publication
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: Time_Stranger_Importer
          path: dist

      - name: Publish the tested ZIP and change notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          BEFORE: ${{ github.event.before }}
          AUTOMATIC_RELEASE: ${{ inputs.automatic_release }}
        run: bash tools/publish_release.sh
